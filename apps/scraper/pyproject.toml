[project]
name = "autoaxe-scraper"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "scrapling>=0.5,<1",
    "tzdata>=2025.1",
]
[dependency-groups]
browser = [
    "playwright==1.62.0",
]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3"]
[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/autoaxe_scraper"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.12"
strict = true
