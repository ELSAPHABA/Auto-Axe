[project]
name = "autoaxe-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "httpx>=0.28,<1",
  "websockets>=14,<17",
  "mcp>=1.12,<2",
  "structlog>=25,<27",
  "pyjwt[crypto]>=2.10,<3",
  "icalendar>=7,<8",
  "feedparser>=6,<7",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10", "pytest-asyncio>=0.26,<2", "hypothesis>=6,<7",
  "ruff>=0.11,<1", "mypy>=1.15,<3", "jsonschema>=4.23,<5",
  "types-jsonschema>=4.23,<5", "testcontainers[postgres]>=4.10,<5",
  "pip-audit>=2.8,<3",
]
collection-smoke = ["scrapling>=0.3,<1", "yfinance>=0.2.65,<2", "feedparser>=6,<7", "icalendar>=6,<8"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autoaxe"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: isolated PostgreSQL integration"]
