# Offline candidate converter only: no live browser or provider access.
name: autoaxe-seibro-offline
services:
  seibro-offline:
    build:
      context: ../..
      dockerfile: apps/scraper/Dockerfile
    entrypoint: ["/app/.venv/bin/python", "-m", "autoaxe_scraper.seibro_capture"]
    stdin_open: true
    network_mode: none
    user: "10003:10003"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    mem_limit: 128m
    cpus: 0.25
    init: true
    restart: "no"
